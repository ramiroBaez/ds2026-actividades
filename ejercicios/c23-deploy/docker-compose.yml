services:
  api:
    build: ./backend
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # 5433 en el host: el 5432 lo usa la DB del TP (grupo06)
    env_file:
      - backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

volumes:
  pgdata: